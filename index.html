<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Live Presentation · Презентація наживо</title>
<style>
  :root{
    --bg:#0f1720; --panel:#16212d; --line:#26364a; --text:#e8eef5; --muted:#93a4b8;
    --accent:#e0b03c; --accent2:#3c8ce0; --ok:#3cc47a; --warn:#e06a3c;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  .hidden{display:none!important}
  .screen{min-height:100%;display:flex;flex-direction:column}

  /* ---------- Language picker ---------- */
  #picker{align-items:center;justify-content:center;padding:24px;gap:28px;text-align:center}
  #picker h1{font-size:clamp(20px,5vw,30px);margin:0;line-height:1.3}
  #picker p{color:var(--muted);margin:0}
  .lang-btns{display:flex;flex-direction:column;gap:14px;width:min(360px,100%)}
  .lang-btn{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);
    padding:20px;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px}
  .lang-btn:active,.lang-btn:hover{border-color:var(--accent)}

  /* ---------- Top bar ---------- */
  .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:5}
  .bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:14px}
  .pill{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  .pill.live{border-color:var(--warn);color:var(--warn)}
  .pill.live::before{content:"● "}
  .pill.ok{border-color:var(--ok);color:var(--ok)}
  .pill.off{color:var(--muted)}
  .chip{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
  .chip.on{border-color:var(--accent);color:var(--accent)}

  /* ---------- Slide ---------- */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
  .slide{width:min(1100px,100%);background:linear-gradient(160deg,#1b2a3a,#121c27);border:1px solid var(--line);
    border-radius:var(--radius);padding:clamp(20px,5vw,56px);min-height:min(70vh,620px);
    display:flex;flex-direction:column;gap:clamp(12px,2.5vw,22px);position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-size:clamp(12px,1.8vw,15px);font-weight:700}
  .slide h2{margin:0;font-size:clamp(24px,4.6vw,48px);line-height:1.15}
  .slide .lead{font-size:clamp(16px,2.4vw,24px);color:#c9d6e3;margin:0;line-height:1.45}
  .slide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:.6em;
    font-size:clamp(16px,2.3vw,24px);line-height:1.4}
  .slide li::marker{color:var(--accent)}
  .slide .foot{margin-top:auto;color:var(--muted);font-size:clamp(12px,1.6vw,14px);display:flex;justify-content:space-between;gap:10px}
  .slide.title-slide{justify-content:center}
  .slide.title-slide h2{font-size:clamp(28px,6vw,60px)}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- Viewer extras ---------- */
  .review-bar{display:flex;gap:10px;justify-content:center;padding:0 16px 16px}
  .navbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:15px}
  .backlive{border-color:var(--warn);color:var(--warn)}
  .waiting{color:var(--muted);text-align:center;padding:40px 20px;font-size:18px}

  /* ---------- Presenter ---------- */
  #presenter .stage{padding:12px}
  #presenter .slide{min-height:auto}
  .next-up{padding:0 16px 8px;color:var(--muted);font-size:14px;text-align:center}
  .controls{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--line)}
  .ctrl{border:none;border-radius:12px;padding:22px 10px;font-size:20px;font-weight:700}
  .ctrl.prev{background:#24344a}
  .ctrl.next{background:var(--accent);color:#1a1405}
  .ctrl:disabled{opacity:.35}
  .tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 14px 12px}

  /* ---------- Login & modal ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;width:min(400px,100%);
    display:flex;flex-direction:column;gap:12px}
  .card h3{margin:0}
  .card input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-size:16px}
  .primary{background:var(--accent);color:#1a1405;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:16px}
  .err{color:var(--warn);font-size:14px;min-height:1em}
  .modal{position:fixed;inset:0;background:rgba(5,10,15,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .qrbox{background:#fff;color:#111;border-radius:var(--radius);padding:24px;text-align:center;width:min(440px,100%)}
  .qrbox svg{width:100%;height:auto}
  .qrbox .url{word-break:break-all;font-size:13px;margin:8px 0 14px;color:#333}
  .qrbox .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .qrbox button{background:#111;color:#fff;border:none;border-radius:8px;padding:10px 14px}
  .demo-note{background:#2a2410;border:1px solid #5a4a18;color:#e9d9a8;font-size:13px;padding:8px 14px;text-align:center}
</style>
<style>
  .pin-input{font-size:28px!important;letter-spacing:.35em;text-align:center}
  .muted{color:var(--muted);font-size:14px;margin:0}
  .cloud-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:0 14px 8px;font-size:13px;color:var(--muted)}
  .lc{font-size:14px;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:2px 7px;letter-spacing:.05em}
  .pin-big{font-size:18px;font-weight:700;letter-spacing:.15em;color:var(--text)}
  .chip.warn{border-color:var(--warn);color:var(--warn)}
</style>
</head>
<body>

<div id="demoNote" class="demo-note hidden"></div>

<!-- ======================= PARTICIPANT PIN ======================= -->
<section id="pin" class="screen hidden" style="align-items:center;justify-content:center;padding:20px">
  <form class="card" id="pinForm" autocomplete="off">
    <h3>🔒 Доступ до презентації<br><span style="color:var(--muted);font-weight:500">Presentation access</span></h3>
    <p class="muted">Введіть PIN-код · Enter PIN</p>
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="••••••">
    <div class="err" id="pinErr"></div>
    <button class="primary" type="submit">Увійти · Enter</button>
  </form>
</section>

<!-- ======================= LANGUAGE PICKER ======================= -->
<section id="picker" class="screen hidden">
  <div><h1 id="pickerTitle"></h1></div>
  <p>Оберіть мову презентації · Choose presentation language</p>
  <div class="lang-btns">
    <button class="lang-btn" data-lang="uk"><b class="lc">UA</b> Українська</button>
    <button class="lang-btn" data-lang="en"><b class="lc">EN</b> English</button>
  </div>
</section>

<!-- ======================= VIEWER ======================= -->
<section id="viewer" class="screen hidden">
  <div class="bar">
    <span id="vStatus" class="pill off">…</span>
    <span class="grow" id="vTitle"></span>
    <button class="chip" data-setlang="uk">UA</button>
    <button class="chip" data-setlang="en">EN</button>
    <button class="chip" id="vOut" title="Вийти · Log out">⏏</button>
  </div>
  <div class="stage" id="vStage"></div>
  <div class="review-bar">
    <button class="navbtn" id="vPrev">‹</button>
    <button class="navbtn backlive hidden" id="vLive"></button>
    <button class="navbtn" id="vNext">›</button>
  </div>
</section>

<!-- ======================= PRESENTER ======================= -->
<section id="presenter" class="screen hidden">
  <div class="bar">
    <span id="pStatus" class="pill off">…</span>
    <span class="grow" id="pInfo"></span>
    <button class="chip" data-plang="uk">UA</button>
    <button class="chip" data-plang="en">EN</button>
  </div>
  <div class="stage" id="pStage"></div>
  <div class="next-up" id="pNextUp"></div>
  <div class="cloud-row" id="pCloud"></div>
  <div class="cloud-row" id="pAccess"></div>
  <div class="tools">
    <button class="chip" id="pQR">QR-код для учасників</button>
    <button class="chip" id="pFirst">⟲ На 1-й слайд</button>
    <button class="chip" id="pOut">⏏ Вийти</button>
  </div>
  <div class="controls">
    <button class="ctrl prev" id="pPrev">‹ Назад</button>
    <button class="ctrl next" id="pNext">Далі ›</button>
  </div>
</section>

<!-- ======================= QR MODAL ======================= -->
<div id="qrModal" class="modal hidden">
  <div class="qrbox">
    <strong>Скануйте, щоб приєднатися · Scan to join</strong>
    <div id="qrSvg"></div>
    <div class="url" id="qrUrl"></div>
    <div class="row">
      <button id="qrCopy">Копіювати посилання</button>
      <button id="qrPrint">Друкувати</button>
      <button id="qrClose">Закрити</button>
    </div>
  </div>
</div>

<!-- QR-бібліотека вбудована нижче -->
<script>/* qrcode-generator 1.4.4, MIT License, (c) Kazuhiko Arase */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';

              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

(function (factory) {
  if (typeof define === 'function' && define.amd) {
      define([], factory);
  } else if (typeof exports === 'object') {
      module.exports = factory();
  }

    return qrcode;
}));

</script>

<!-- Локальний файл зі слайдами: є лише на ноутбуці ведучого. На хостингу його немає — це нормально. -->
<script src="slides.js" onerror="window.PRESENTATION=null"></script>

<script>
/* =====================================================================
   1. НАЛАШТУВАННЯ / SETTINGS
   ===================================================================== */

// Конфігурація проєкту Firebase (див. ІНСТРУКЦІЯ.md, крок 3).
// Поки тут null — ДЕМО-РЕЖИМ: синхронізація лише між вкладками одного браузера.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA2W8eW7jm9MzJdh-4Zpu72Lrn1c8wUuWs",
  authDomain: "bilingual-live-presentation.firebaseapp.com",
  databaseURL: "https://bilingual-live-presentation-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bilingual-live-presentation",
  appId: "1:698812298639:web:2e3b5b6cf587a5051b07fa"
};

// Два службові облікові записи у Firebase Authentication.
// Користувач вводить лише PIN — це пароль одного з них (мінімум 6 символів).
// Яким PIN увійшли — така й роль: учасник або ведучий.
const PARTICIPANT_EMAIL = "participants@panel.local";
const PRESENTER_EMAIL   = "presenter@panel.local";

// PIN-коди для ДЕМО-РЕЖИМУ (у робочому режимі PIN задаються у Firebase)
const DEMO_PRESENTER_PIN   = "135790";
const DEMO_PARTICIPANT_PIN = "246810";

const ALLOW_REVIEW = true;   // учасники можуть гортати НАЗАД уже показані слайди

/* =====================================================================
   2. ТЕКСТИ ІНТЕРФЕЙСУ / UI STRINGS
   ===================================================================== */
const UI = {
  uk:{ live:"НАЖИВО", ready:"очікування", offline:"немає зв'язку", waiting:"Очікуємо початку доповіді…",
       loading:"Завантаження слайдів…", backLive:"● Повернутися до поточного слайда" },
  en:{ live:"LIVE", ready:"standby", offline:"offline", waiting:"Waiting for the presentation to start…",
       loading:"Loading slides…", backLive:"● Back to live slide" }
};

/* =====================================================================
   3. ДОПОМІЖНЕ / HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ROOM = (params.get("room") || "panel").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,40) || "panel";
const DEMO = !FIREBASE_CONFIG;
let LOCAL = window.PRESENTATION && Array.isArray(window.PRESENTATION.slides) ? window.PRESENTATION : null;

// Поточна презентація (з хмари; у демо — з локального slides.js)
let DECK = {uk:{title:"Презентація"}, en:{title:"Presentation"}};
let SLIDES = [];

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function esc(s){ return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clampIdx(i){ return Math.max(0, Math.min(Math.max(SLIDES.length-1,0), i|0)); }
function show(id){ ["pin","picker","viewer","presenter"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); }
function randomPin(n=6){ const a=new Uint32Array(n); crypto.getRandomValues(a); return Array.from(a, x=>x%10).join(""); }
const sstore = { get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }, del(k){ try{ sessionStorage.removeItem(k); }catch(e){} } };
let currentParticipantPin = null;   // відомий лише ведучому
function setPresentation(p){
  if(!p || !Array.isArray(p.slides)) return false;
  SLIDES = p.slides; DECK = p.deck || DECK; return true;
}

function renderSlide(container, idx, lang){
  const s = SLIDES[idx]; if(!s){ container.innerHTML = ""; return; }
  const c = s[lang] || s.uk || {};
  const body = s.type === "bullets"
    ? `<ul>${(c.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`
    : (c.lead ? `<p class="lead">${esc(c.lead)}</p>` : "");
  container.innerHTML = `
    <article class="slide fade ${s.type==="title"?"title-slide":""}">
      ${c.kicker?`<div class="kicker">${esc(c.kicker)}</div>`:""}
      <h2>${esc(c.title)}</h2>
      ${body}
      <div class="foot"><span>${esc((DECK[lang]||{}).title)}</span><span>${idx+1} / ${SLIDES.length}</span></div>
    </article>`;
}

function viewerUrl(){
  const u = new URL(location.href);
  u.search = ""; u.hash = "";
  if(ROOM !== "panel") u.searchParams.set("room", ROOM);
  return u.toString();
}

/* =====================================================================
   4. СИНХРОНІЗАЦІЯ / SYNC LAYER (Firebase або демо)
     loginWithPin(pin)       -> "presenter" | "participant" (або помилка)
     role()                  -> "presenter" | "participant" | null (поточний вхід)
     logout()
     onSlides(cb)            — презентація з хмари
     publishSlides(p)        — лише ведучий
     onState(cb) / setState  — номер слайда
     announce(lang), onViewers(cb), onConn(cb)
     onDenied(cb)            — учасник втратив доступ (PIN змінено / доступ закрито)
     onAccess(cb), setAccessOpen(bool), resetParticipantPin() — лише ведучий
   ===================================================================== */
const clientId = (()=>{ let id = store.get("bp_cid"); if(!id){ id = Math.random().toString(36).slice(2,10); store.set("bp_cid",id);} return id; })();

function makeDemoSync(){
  const KEY = "bp_state_"+ROOM, AUTH = "bp_demo_role_"+ROOM;
  const ss = { get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }, del(k){ try{ sessionStorage.removeItem(k); }catch(e){} } };
  let ch = null; try{ ch = new BroadcastChannel("bp_"+ROOM); }catch(e){}
  const stateCbs=[], viewerCbs=[], seen={};
  const readState = ()=>{ try{ return JSON.parse(store.get(KEY)) || null; }catch(e){ return null; } };
  const emitState = st => stateCbs.forEach(cb=>cb(st));
  if(ch) ch.onmessage = e => {
    const m=e.data; if(!m) return;
    if(m.t==="state") emitState(m.s);
    if(m.t==="hello") seen[m.id] = {lang:m.lang, at:Date.now()};
  };
  window.addEventListener("storage", e=>{ if(e.key===KEY) emitState(readState()); });
  // Резерв: опитування кожні 500 мс (на випадок, якщо браузер не передає повідомлення між вікнами, напр. для file://)
  let lastRaw = store.get(KEY);
  setInterval(()=>{ const raw = store.get(KEY); if(raw !== lastRaw){ lastRaw = raw; emitState(readState()); } }, 500);
  setInterval(()=>{
    const now=Date.now(), c={uk:0,en:0};
    for(const id in seen){ if(now-seen[id].at<12000) c[seen[id].lang]++; else delete seen[id]; }
    viewerCbs.forEach(cb=>cb(c));
  }, 2000);
  let helloTimer=null;
  const ACC = "bp_demo_access_"+ROOM;
  const readAcc = () => { try{ return Object.assign({open:true, participantPin:DEMO_PARTICIPANT_PIN, notBefore:0}, JSON.parse(store.get(ACC))||{}); }catch(e){ return {open:true, participantPin:DEMO_PARTICIPANT_PIN, notBefore:0}; } };
  const writeAcc = patch => store.set(ACC, JSON.stringify(Object.assign(readAcc(), patch)));
  return {
    async loginWithPin(pin){
      const acc = readAcc();
      const r = pin===DEMO_PRESENTER_PIN ? "presenter" : pin===acc.participantPin ? "participant" : null;
      if(!r) throw new Error("bad");
      ss.set(AUTH, r); ss.set(AUTH+"_t", String(Date.now())); return r;
    },
    async role(){ return ss.get(AUTH); },
    async logout(){ ss.del(AUTH); },
    onDenied(cb){
      setInterval(()=>{
        if(ss.get(AUTH)!=="participant") return;
        const acc = readAcc(), t = +ss.get(AUTH+"_t")||0;
        if(!acc.open || t < acc.notBefore) cb();
      }, 1000);
    },
    onAccess(cb){ let last=""; const tick=()=>{ const a=readAcc(), k=JSON.stringify(a); if(k!==last){ last=k; cb(a); } }; tick(); setInterval(tick, 700); },
    async setAccessOpen(v){ writeAcc({open:!!v, notBefore: v ? readAcc().notBefore : Date.now()}); },
    async resetParticipantPin(){ const pin = randomPin(6); writeAcc({participantPin:pin, notBefore:Date.now()}); return pin; },
    onSlides(cb){ setTimeout(()=>cb(LOCAL),0); },
    async publishSlides(){ },
    onState(cb){ stateCbs.push(cb); setTimeout(()=>cb(readState()),0); },
    async setState(st){ store.set(KEY, JSON.stringify(st)); if(ch) ch.postMessage({t:"state", s:st}); emitState(st); },
    announce(lang){ clearInterval(helloTimer); const hi=()=>{ if(ch) ch.postMessage({t:"hello", id:clientId, lang}); }; hi(); helloTimer=setInterval(hi,5000); },
    onViewers(cb){ viewerCbs.push(cb); },
    onConn(cb){ cb(true); }
  };
}

async function makeFirebaseSync(){
  const V = "10.12.2";
  const appMod  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const dbMod   = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const app  = appMod.initializeApp(FIREBASE_CONFIG);
  const db   = dbMod.getDatabase(app);
  const auth = authMod.getAuth(app);
  // вхід діє в межах вкладки: на одному ноутбуці можна мати і пульт, і вікно учасника
  try{ await authMod.setPersistence(auth, authMod.browserSessionPersistence); }catch(e){}
  const R = p => dbMod.ref(db, `rooms/${ROOM}/${p}`);
  const authReady = new Promise(res => { const un = authMod.onAuthStateChanged(auth, () => { un(); res(); }); });
  const ACC = dbMod.ref(db, "access");
  let denyCb = null;
  const denied = () => { if(denyCb && auth.currentUser && (auth.currentUser.email||"").toLowerCase()===PARTICIPANT_EMAIL.toLowerCase()) denyCb(); };
  return {
    onDenied(cb){ denyCb = cb; },
    onAccess(cb){ dbMod.onValue(ACC, s => cb(s.val()||{}), () => cb({error:true})); },
    async setAccessOpen(v){
      const patch = {open: !!v};
      if(!v) patch.notBefore = dbMod.serverTimestamp();   // закриття одразу відключає всіх учасників
      await dbMod.update(ACC, patch);
    },
    async resetParticipantPin(){
      const oldPin = (await dbMod.get(dbMod.child(ACC, "participantPin"))).val();
      if(!oldPin) throw new Error("Поточний PIN учасника невідомий (немає в access/participantPin)");
      const newPin = randomPin(6);
      // окремий екземпляр Firebase, щоб не вийти з облікового запису ведучого
      const app2 = appMod.initializeApp(FIREBASE_CONFIG, "pin-reset-"+Date.now());
      const auth2 = authMod.getAuth(app2);
      try{
        await authMod.setPersistence(auth2, authMod.inMemoryPersistence);
        const cred = await authMod.signInWithEmailAndPassword(auth2, PARTICIPANT_EMAIL, String(oldPin));
        await authMod.updatePassword(cred.user, newPin);
        await authMod.signOut(auth2);
      } finally { try{ await appMod.deleteApp(app2); }catch(e){} }
      await dbMod.update(ACC, {participantPin:newPin, notBefore: dbMod.serverTimestamp()});
      return newPin;
    },
    async loginWithPin(pin){
      // спершу пробуємо PIN учасника, потім — ведучого
      try{ await authMod.signInWithEmailAndPassword(auth, PARTICIPANT_EMAIL, pin); return "participant"; }
      catch(e1){
        if(String(e1.code).includes("too-many")) throw e1;
        await authMod.signInWithEmailAndPassword(auth, PRESENTER_EMAIL, pin); return "presenter";
      }
    },
    async role(){
      await authReady; const u = auth.currentUser; if(!u) return null;
      const em = (u.email||"").toLowerCase();
      return em === PRESENTER_EMAIL.toLowerCase() ? "presenter" : em === PARTICIPANT_EMAIL.toLowerCase() ? "participant" : null;
    },
    async logout(){ await authMod.signOut(auth); },
    onSlides(cb){ dbMod.onValue(R("presentation"), s => cb(s.val()), () => { cb(null); denied(); }); },
    async publishSlides(p){ await dbMod.set(R("presentation"), JSON.parse(JSON.stringify(p))); },
    onState(cb){ dbMod.onValue(R("state"), s => cb(s.val()), () => { cb(null); denied(); }); },
    async setState(st){ await dbMod.set(R("state"), st); },
    announce(lang){
      const me = R(`viewers/${clientId}`);
      dbMod.onValue(dbMod.ref(db, ".info/connected"), s => {
        if(s.val()===true){ dbMod.onDisconnect(me).remove(); dbMod.set(me, lang).catch(()=>{}); }
      });
      dbMod.set(me, lang).catch(()=>{});
    },
    onViewers(cb){
      dbMod.onValue(R("viewers"), s => {
        const c={uk:0,en:0}; Object.values(s.val()||{}).forEach(l=>{ if(c[l]!==undefined) c[l]++; }); cb(c);
      }, ()=>{});
    },
    onConn(cb){ dbMod.onValue(dbMod.ref(db, ".info/connected"), s => cb(s.val()===true)); }
  };
}

/* =====================================================================
   5. УЧАСНИК / PARTICIPANT
   ===================================================================== */
let vLang = null, live = {slide:0, started:false}, vIdx = 0, reviewing = false, connOk = false, slidesReady = false;

async function startViewer(sync){
  // --- втрата доступу: PIN змінено або доступ закрито ---
  let kicked = false;
  sync.onDenied(async () => {
    if(kicked) return; kicked = true;
    sstore.set("bp_kicked","1"); await sync.logout(); location.reload();
  });
  // --- мова ---
  document.querySelectorAll(".lang-btn").forEach(b => b.onclick = () => pickLang(b.dataset.lang));
  document.querySelectorAll("[data-setlang]").forEach(b => b.onclick = () => pickLang(b.dataset.setlang));
  function pickLang(l){
    vLang = l; store.set("bp_lang", l); document.documentElement.lang = l;
    document.querySelectorAll("[data-setlang]").forEach(b=>b.classList.toggle("on", b.dataset.setlang===l));
    sync.announce(l); show("viewer"); drawViewer();
  }
  const drawPickerTitle = () => $("pickerTitle").innerHTML = `${esc(DECK.uk.title)}<br><span style="color:var(--muted)">${esc(DECK.en.title)}</span>`;
  drawPickerTitle();
  const saved = store.get("bp_lang");
  if(saved==="uk"||saved==="en") pickLang(saved); else show("picker");

  // --- дані ---
  sync.onSlides(p => { slidesReady = setPresentation(p); drawPickerTitle(); if(!reviewing) vIdx = clampIdx(live.slide); if(vLang) drawViewer(); });
  sync.onConn(ok => { connOk = ok; drawStatus(); });
  sync.onState(st => {
    if(st && typeof st.slide==="number") live = {slide:st.slide|0, started:!!st.started};
    if(!reviewing) vIdx = clampIdx(live.slide);
    if(vLang) drawViewer();
  });

  $("vPrev").onclick = () => step(-1);
  $("vNext").onclick = () => step(1);
  $("vLive").onclick = () => { reviewing=false; vIdx=clampIdx(live.slide); drawViewer(); };
  document.addEventListener("keydown", e => { if(!vLang) return; if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1); });
  let tx=null;
  $("vStage").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive:true});
  $("vStage").addEventListener("touchend", e => { if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>60) step(dx<0?1:-1); });
}
function step(d){
  if(!ALLOW_REVIEW || !live.started || !slidesReady) return;
  const n = clampIdx(vIdx + d);
  if(n > live.slide) return;          // наперед не можна
  vIdx = n; reviewing = vIdx !== clampIdx(live.slide); drawViewer();
}
function drawStatus(){
  if(!vLang) return;
  const t = UI[vLang], el = $("vStatus");
  if(!connOk){ el.className="pill off"; el.textContent=t.offline; return; }
  el.className = live.started ? "pill live" : "pill ok";
  el.textContent = live.started ? t.live : t.ready;
}
function drawViewer(){
  const t = UI[vLang], o = UI[vLang==="uk"?"en":"uk"];
  $("vTitle").textContent = (DECK[vLang]||{}).title || "";
  if(!slidesReady)        $("vStage").innerHTML = `<div class="waiting">${esc(t.loading)}</div>`;
  else if(!live.started)  $("vStage").innerHTML = `<div class="waiting">${esc(t.waiting)}<br><br><span style="font-size:14px">${esc(o.waiting)}</span></div>`;
  else                    renderSlide($("vStage"), vIdx, vLang);
  $("vLive").textContent = t.backLive;
  $("vLive").classList.toggle("hidden", !reviewing);
  const canNav = ALLOW_REVIEW && live.started && slidesReady;
  $("vPrev").classList.toggle("hidden", !canNav);
  $("vNext").classList.toggle("hidden", !canNav);
  $("vPrev").disabled = vIdx<=0;
  $("vNext").disabled = vIdx>=live.slide;
  drawStatus();
}

/* =====================================================================
   6. ВЕДУЧИЙ / PRESENTER
   ===================================================================== */
async function startPresenter(sync){
  let pLang = store.get("bp_plang") || "uk", cur = {slide:0, started:false}, counts={uk:0,en:0}, ok=false;
  let cloud = null;   // презентація в хмарі

  show("presenter");

  const draw = () => {
    renderSlide($("pStage"), cur.slide, pLang);
    if(!SLIDES.length) $("pStage").innerHTML = `<div class="waiting">Слайдів у хмарі ще немає.<br>Натисніть «📂 Обрати slides.js», а потім «☁ Опублікувати слайди».</div>`;
    const nx = SLIDES[cur.slide+1];
    $("pNextUp").textContent = !SLIDES.length ? "" : nx ? `Наступний: ${(nx[pLang]||nx.uk).title}` : "Це останній слайд";
    $("pPrev").disabled = cur.slide<=0 || !SLIDES.length;
    $("pNext").textContent = cur.started ? (cur.slide>=SLIDES.length-1 ? "Кінець" : "Далі ›") : "▶ Почати";
    $("pNext").disabled = !SLIDES.length || (cur.started && cur.slide>=SLIDES.length-1);
    $("pInfo").textContent = `Кімната «${ROOM}» · учасників: UA ${counts.uk||0} · EN ${counts.en||0}`;
    const st = $("pStatus");
    st.className = !ok ? "pill off" : (cur.started ? "pill live" : "pill ok");
    st.textContent = !ok ? "немає зв'язку" : (cur.started ? "НАЖИВО" : "готово");
    document.querySelectorAll("[data-plang]").forEach(b=>b.classList.toggle("on", b.dataset.plang===pLang));
    drawCloud();
  };

  // Рядок стану хмари + кнопка публікації (лише коли поруч є локальний slides.js)
  function drawCloud(){
    const row = $("pCloud");
    if(DEMO){ row.innerHTML = `Слайди: локальний slides.js (${SLIDES.length})`; return; }
    const inCloud = cloud && Array.isArray(cloud.slides) ? cloud.slides.length : 0;
    let html = `☁ У хмарі: ${inCloud ? inCloud+" слайдів" : "немає"}`;
    html += ` <label class="chip" style="cursor:pointer">📂 Обрати slides.js<input type="file" id="pFile" accept=".js,text/javascript" hidden></label>`;
    if(LOCAL){
      const same = cloud && JSON.stringify(cloud) === JSON.stringify(JSON.parse(JSON.stringify(LOCAL)));
      html += ` · локально: ${LOCAL.slides.length}` +
        ` <button class="chip ${same?"":"warn"}" id="pPublish">${same ? "✓ Актуально" : "☁ Опублікувати слайди"}</button>`;
    }
    row.innerHTML = html;
    $("pFile").onchange = e => {
      const f = e.target.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try{
          const w = {}; new Function("window", rd.result)(w);
          if(!w.PRESENTATION || !Array.isArray(w.PRESENTATION.slides)) throw new Error("no slides");
          LOCAL = w.PRESENTATION; drawCloud();
        }catch(err){ alertBar("Не вдалося прочитати slides.js — перевірте синтаксис файлу (коми, лапки, дужки)"); }
      };
      rd.readAsText(f, "utf-8");
    };
    const btn = $("pPublish");
    if(btn) btn.onclick = async () => {
      btn.textContent = "Публікую…";
      try{ await sync.publishSlides(LOCAL); }
      catch(e){ btn.textContent = "Помилка — перевірте правила доступу"; }
    };
  }

  // --- доступ учасників ---
  let acc = {}, pinShown = true, busy = false;
  function drawAccess(){
    const row = $("pAccess");
    if(acc.error){ row.innerHTML = "Доступ учасників: немає прав читання (оновіть правила бази)"; return; }
    currentParticipantPin = acc.participantPin || null;
    const open = acc.open !== false;
    row.innerHTML =
      `Учасники: <span class="pill ${open?"ok":"off"}">${open?"доступ відкрито":"доступ закрито"}</span>` +
      ` PIN учасника: <span class="pin-big" id="pPinVal">${currentParticipantPin ? (pinShown ? esc(currentParticipantPin) : "••••••") : "—"}</span>` +
      ` <button class="chip" id="pPinEye" title="Показати/сховати">👁</button>` +
      ` <button class="chip" id="pPinNew">🔄 Новий PIN</button>` +
      ` <button class="chip ${open?"warn":""}" id="pAccToggle">${open ? "⛔ Закрити доступ" : "✅ Відкрити доступ"}</button>`;
    $("pPinEye").onclick = () => { pinShown = !pinShown; drawAccess(); };
    $("pPinNew").onclick = async () => {
      if(busy) return;
      if(!confirmInline($("pPinNew"), "Точно? Усі учасники вийдуть")) return;
      busy = true; $("pPinNew").textContent = "Змінюю…";
      try{ const np = await sync.resetParticipantPin(); pinShown = true; acc = Object.assign({}, acc, {participantPin:np}); drawAccess(); }
      catch(e){ alertBar("Не вдалося змінити PIN: " + (e.code || e.message)); }
      finally{ busy = false; drawAccess(); }
    };
    $("pAccToggle").onclick = async () => {
      if(busy) return;
      if(open && !confirmInline($("pAccToggle"), "Точно? Усі учасники вийдуть")) return;
      busy = true;
      $("pAccToggle").textContent = "…";
      try{ await sync.setAccessOpen(!open); }catch(e){ alertBar("Не вдалося змінити доступ: " + (e.code || e.message)); }
      finally{ busy = false; drawAccess(); }
    };
  }
  // підтвердження другим натисканням (без системних діалогів)
  function confirmInline(btn, text){
    if(btn.dataset.armed === "1"){ btn.dataset.armed = ""; return true; }
    btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = text;
    setTimeout(()=>{ if(btn.isConnected && btn.dataset.armed==="1"){ btn.dataset.armed=""; btn.textContent = old; } }, 4000);
    return false;
  }
  sync.onAccess(a => { acc = a || {}; drawAccess(); });

  sync.onSlides(p => { cloud = p; setPresentation(DEMO ? LOCAL : p) || (SLIDES = []); cur.slide = clampIdx(cur.slide); draw(); });
  sync.onConn(v => { ok=v; draw(); });
  sync.onState(st => { if(st && typeof st.slide==="number") cur = {slide:clampIdx(st.slide), started:!!st.started}; draw(); });
  sync.onViewers(c => { counts=c; draw(); });

  const go = async idx => {
    const next = {slide:clampIdx(idx), started:true, at:Date.now()};
    cur = next; draw();
    try{ await sync.setState(next); }catch(e){ alertBar("Не вдалося надіслати слайд — перевірте з'єднання / права доступу"); }
  };
  $("pNext").onclick = () => go(cur.started ? cur.slide+1 : 0);
  $("pPrev").onclick = () => go(cur.slide-1);
  $("pFirst").onclick = () => go(0);
  document.querySelectorAll("[data-plang]").forEach(b => b.onclick = () => { pLang=b.dataset.plang; store.set("bp_plang",pLang); draw(); });
  document.addEventListener("keydown", e => {
    if(e.target && e.target.tagName==="INPUT") return;
    if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); if(!$("pNext").disabled) $("pNext").click(); }
    if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); if(!$("pPrev").disabled) $("pPrev").click(); }
  });
  $("pQR").onclick = openQR;
  draw();
}
function alertBar(msg){ const n=$("demoNote"); n.textContent=msg; n.classList.remove("hidden"); n.style.background="#3a1a12"; }

/* =====================================================================
   7. QR
   ===================================================================== */
function openQR(){
  const url = viewerUrl();
  $("qrUrl").textContent = url;
  try{ const qr = qrcode(0,"M"); qr.addData(url); qr.make(); $("qrSvg").innerHTML = qr.createSvgTag({cellSize:8, margin:2, scalable:true}); }
  catch(e){ $("qrSvg").textContent = "Не вдалося створити QR — скористайтесь посиланням."; }
  $("qrModal").classList.remove("hidden");
}
$("qrClose").onclick = () => $("qrModal").classList.add("hidden");
$("qrCopy").onclick = async () => { try{ await navigator.clipboard.writeText(viewerUrl()); $("qrCopy").textContent="Скопійовано ✓"; }catch(e){} };
$("qrPrint").onclick = () => {
  const w = window.open("", "_blank"); if(!w) return;
  w.document.write(`<html><head><meta charset="utf-8"><title>QR</title></head><body style="font-family:sans-serif;text-align:center;padding:40px">
    <h1>${esc(DECK.uk.title)} · ${esc(DECK.en.title)}</h1>
    <p style="font-size:20px">Скануйте камерою телефона · Scan with your phone camera</p>
    <div style="width:420px;margin:30px auto">${$("qrSvg").innerHTML}</div>
    <p style="font-size:14px;word-break:break-all">${esc(viewerUrl())}</p>
    <p style="font-size:26px;margin-top:30px">PIN: <b style="letter-spacing:.15em">${currentParticipantPin ? esc(currentParticipantPin) : "______________"}</b></p>
    <script>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close();
};

/* =====================================================================
   8. СТАРТ
   ===================================================================== */
async function askPin(sync){
  show("pin"); $("pinInput").value = ""; setTimeout(()=>$("pinInput").focus(),50);
  $("pinErr").textContent = sstore.get("bp_kicked") ? "Доступ закрито або PIN змінено · Access closed or PIN changed" : "";
  sstore.del("bp_kicked");
  return new Promise(resolve => {
    $("pinForm").onsubmit = async e => {
      e.preventDefault(); $("pinErr").textContent = "";
      const pin = $("pinInput").value.trim(); if(!pin) return;
      const btn = $("pinForm").querySelector("button"); btn.disabled = true;
      try{ resolve(await sync.loginWithPin(pin)); }
      catch(err){
        const tooMany = String(err && (err.code||err.message)).includes("too-many");
        $("pinErr").textContent = tooMany ? "Забагато спроб, зачекайте кілька хвилин · Too many attempts, please wait"
                                          : "Невірний PIN · Wrong PIN";
        $("pinInput").value = "";
      }
      finally{ btn.disabled = false; }
    };
  });
}

(async function init(){
  if(DEMO){
    const n=$("demoNote");
    n.innerHTML = `ДЕМО-РЕЖИМ (лише вкладки цього браузера) · PIN учасника: <b>${DEMO_PARTICIPANT_PIN}</b> (якщо не змінено на пульті) · PIN ведучого: <b>${DEMO_PRESENTER_PIN}</b>`;
    n.classList.remove("hidden");
  }
  let sync;
  try{ sync = DEMO ? makeDemoSync() : await makeFirebaseSync(); }
  catch(e){ alertBar("Не вдалося підключитися до сервера синхронізації: "+e.message); return; }

  const logout = async () => { await sync.logout(); location.reload(); };
  $("vOut").onclick = logout; $("pOut").onclick = logout;

  let role = await sync.role();
  if(!role) role = await askPin(sync);
  if(role === "presenter") startPresenter(sync); else startViewer(sync);
})();
</script>
